<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e9f2;
    --line-soft: #eef1f6;
    --blue: #2563eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    font-size: 15px;
  }

  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .card {
    max-width: 1200px;
    margin: 32px auto;
    padding: 28px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  .page-header { margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 650; letter-spacing: -0.02em; }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  h3 { margin: 0 0 8px; font-size: .9rem; color: #374151; }

  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .muted { color: var(--muted); }

  .coverage {
    margin: 16px 0;
    padding: .75rem 1rem;
    background: #eff6ff;
    border: 1px solid #dbeafe;
    border-radius: 12px;
    color: #1e3a8a;
    font-size: .9rem;
  }

  .version-summary {
    margin: -8px 0 16px;
    color: var(--muted);
    font-size: .85rem;
  }

  .section {
    margin-top: 18px;
    padding: 18px;
    background: #fbfcfe;
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .plain-list { margin: 0; padding-left: 1.2rem; }
  .plain-list li { margin: .35rem 0; }

  .chip-grid { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: .22rem .6rem;
    background: #eef2ff;
    color: #3730a3;
    font-size: .78rem;
    white-space: nowrap;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px;
    margin: 16px 0 20px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { color: var(--muted); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  .field select,
  .field input {
    min-height: 38px;
    padding: .5rem .9rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: .875rem;
  }

  .field input { min-width: 130px; }

  .btn {
    min-height: 38px;
    padding: .5rem 1.2rem;
    border: 0;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    font: inherit;
    font-size: .875rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn:hover { background: #1d4ed8; }

  .table-wrap {
    overflow: auto;
    max-height: 72vh;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }

  table { width: 100%; min-width: 900px; border-collapse: collapse; font-size: .875rem; }

  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: .75rem .9rem;
    background: #f8fafc;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: .7rem;
    font-weight: 700;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: .06em;
    white-space: nowrap;
  }

  tbody td {
    padding: .8rem .9rem;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: top;
  }

  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #f8fafc; }
  th:first-child, td:first-child { padding-left: 1.1rem; }

  .badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: .2rem .6rem;
    font-size: .72rem;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
  }

  .badge--ok,
  .badge--self_serve,
  .badge--yes,
  .badge--official { background: #dcfce7; color: #166534; }

  .badge--needs_human,
  .badge--trial_or_paid,
  .badge--partial,
  .badge--community { background: #fef3c7; color: #92400e; }

  .badge--error,
  .badge--gated,
  .badge--no { background: #fee2e2; color: #991b1b; }

  .badge--unknown,
  .badge--none_found,
  .badge--neutral { background: #f1f5f9; color: #475569; }

  .version-v1 { display: inline-block; margin-left: .35rem; padding: .05rem .3rem;
    border-radius: .25rem; background: #e2e8f0; color: #475569;
    font-size: .7rem; font-weight: 600; vertical-align: middle; }

  .sources { display: flex; flex-wrap: wrap; gap: .25rem .5rem; align-items: center; }
  .source-count { color: var(--muted); font-size: .75rem; white-space: nowrap; }
  .source-link { font-size: .75rem; white-space: nowrap; }
  .source-link::before { content: "\2197"; margin-right: .15rem; }

  .footer-link { margin-top: 18px; font-size: .875rem; }

  @media (max-width: 640px) {
    .card { margin: 12px; padding: 18px; border-radius: 14px; }
    h1 { font-size: 1.35rem; }
    .chip-grid { grid-template-columns: 1fr; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; }
    .field:first-child { grid-column: 1 / -1; }
    .btn { width: 100%; }
    .table-wrap { max-height: none; }
  }
</style>
